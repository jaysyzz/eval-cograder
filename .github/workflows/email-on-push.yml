name: Email on push

on:
  push:
    branches: ["**"]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send email
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: eval-cograder notifications <${{ secrets.MAIL_USERNAME }}>
          to: syz@ourdojo.org
          subject: "[eval-cograder] ${{ github.actor }} pushed to ${{ github.ref_name }}"
          body: |
            ${{ github.actor }} pushed to ${{ github.ref_name }} in ${{ github.repository }}.

            Head commit: ${{ github.event.head_commit.message }}

            View changes: ${{ github.event.compare }}
